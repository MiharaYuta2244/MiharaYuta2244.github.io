<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <!-- Honeycomb / Hexagonal background pattern -->
    <radialGradient id="titleBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f3747"/>
      <stop offset="60%" stop-color="#071b24"/>
      <stop offset="100%" stop-color="#030b0f"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#titleBg)"/>
  
  <!-- Stylized Tile/Grid Elements -->
  <g stroke="#155e75" stroke-width="1.5" opacity="0.3" fill="none">
    <circle cx="150" cy="180" r="40"/>
    <circle cx="250" cy="180" r="40"/>
    <circle cx="350" cy="180" r="40"/>
    <circle cx="450" cy="180" r="40"/>
  </g>

  <!-- Title Logo Banner (Matching slide 6) -->
  <g transform="translate(100, 90)">
    <text x="110" y="55" fill="#facc15" font-family="'Outfit', sans-serif" font-size="52" font-weight="900" letter-spacing="4" text-anchor="middle">
      SMASH
    </text>
    <text x="290" y="55" fill="#facc15" font-family="'Outfit', sans-serif" font-size="52" font-weight="900" letter-spacing="4" text-anchor="middle">
      OUT
    </text>
  </g>

  <!-- Menu Bar -->
  <rect x="150" y="210" width="300" height="4" fill="#94a3b8" opacity="0.6"/>
  <rect x="220" y="235" width="160" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="300" y="258" fill="#f8fafc" font-size="18" font-family="'Outfit', sans-serif" font-weight="bold" text-anchor="middle">Play</text>
  <text x="300" y="295" fill="#94a3b8" font-size="16" font-family="'Outfit', sans-serif" font-weight="bold" text-anchor="middle">Quit</text>
  
  <text x="30" y="340" fill="#64748b" font-size="11" font-family="'Outfit', sans-serif">DirectX 12 Custom Engine Title Screen</text>
</svg>
