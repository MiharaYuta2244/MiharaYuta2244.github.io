<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Title Screen -->
  <rect width="600" height="360" fill="#7dd3fc"/>
  <!-- Decorative cloud -->
  <ellipse cx="120" cy="80" rx="60" ry="30" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="480" cy="90" rx="80" ry="35" fill="#ffffff" opacity="0.6"/>
  <!-- Logo -->
  <text x="80" y="70" fill="#0369a1" font-size="28" font-family="'Outfit', sans-serif" font-weight="900">おかしあつめて</text>
  <text x="80" y="115" fill="#0284c7" font-size="44" font-family="'Outfit', sans-serif" font-weight="900">クマサイダー</text>
  <!-- Soda bottle & bear -->
  <circle cx="450" cy="200" r="50" fill="#fff" stroke="#38bdf8" stroke-width="4"/>
  <rect x="360" y="150" width="30" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <!-- Menu Items (Matching Slide 10) -->
  <g transform="translate(100, 180)" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold">
    <g transform="translate(0, 0)">
      <polygon points="-25,7 -10,0 -10,14" fill="#0284c7"/>
      <text x="0" y="12" fill="#0369a1">プレイ</text>
    </g>
    <text x="0" y="55" fill="#64748b">オプション</text>
    <text x="0" y="98" fill="#64748b">ヤメル</text>
  </g>
  <rect x="20" y="325" width="180" height="22" rx="4" fill="#0f172a" fill-opacity="0.8"/>
  <text x="110" y="340" fill="#fff" font-size="11" font-family="sans-serif" text-anchor="middle">タイトル画面 (Title Screen)</text>
</svg>
