<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Play Screen (Matching Slide 10 middle) -->
  <rect width="600" height="360" fill="#fef08a"/>
  <!-- Stage Path -->
  <path d="M 180 0 L 420 0 L 420 360 L 180 360 Z" fill="#38bdf8"/>
  <path d="M 200 0 L 400 0 L 400 360 L 200 360 Z" fill="#0ea5e9"/>
  <!-- Candies & Snacks falling -->
  <circle cx="280" cy="80" r="14" fill="#f43f5e" stroke="#fff" stroke-width="2"/>
  <text x="310" y="85" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold">+10</text>
  <rect x="320" y="160" width="24" height="24" rx="4" fill="#fbbf24" stroke="#fff" stroke-width="2"/>
  <text x="355" y="177" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold">+100</text>
  <!-- Soda Bottle Gauge on Right -->
  <g transform="translate(480, 70)">
    <rect width="40" height="200" rx="10" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    <rect x="5" y="60" width="30" height="135" rx="6" fill="#0284c7"/>
    <!-- Bubbles in bottle -->
    <circle cx="20" cy="120" r="4" fill="#fff" opacity="0.8"/>
    <circle cx="15" cy="90" r="3" fill="#fff" opacity="0.8"/>
  </g>
  <!-- Score Display (28825) matching slide 10 -->
  <g transform="translate(40, 110)">
    <ellipse cx="40" cy="40" rx="35" ry="30" fill="#f472b6" stroke="#fff" stroke-width="3"/>
    <circle cx="30" cy="35" r="5" fill="#1e293b"/>
    <circle cx="50" cy="35" r="5" fill="#1e293b"/>
    <rect x="85" y="15" width="110" height="45" rx="6" fill="#0f172a" fill-opacity="0.85"/>
    <text x="140" y="47" fill="#fef08a" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" text-anchor="middle">28825</text>
  </g>
  <!-- Bear Player Character -->
  <g transform="translate(270, 240)">
    <circle cx="30" cy="30" r="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="12" cy="12" r="10" fill="#ffffff"/>
    <circle cx="48" cy="12" r="10" fill="#ffffff"/>
    <circle cx="20" cy="26" r="4" fill="#0f172a"/>
    <circle cx="40" cy="26" r="4" fill="#0f172a"/>
  </g>
  <rect x="20" y="325" width="180" height="22" rx="4" fill="#0f172a" fill-opacity="0.8"/>
  <text x="110" y="340" fill="#fff" font-size="11" font-family="sans-serif" text-anchor="middle">プレイ画面 (Play Screen)</text>
</svg>
