<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Enemy Vision Cone Radial/Linear Gradient -->
    <radialGradient id="visionCone" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.05"/>
    </radialGradient>

    <!-- Post-Effect Glow Filter -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bloodSplatter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="80%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Arena Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Floor Grid (Isometric / Top-down Perspective) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>

    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Dungeon / Level Walls with dynamic shadows -->
  <rect x="0" y="0" width="160" height="180" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="270" width="160" height="180" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="640" y="0" width="160" height="180" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="640" y="270" width="160" height="180" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Center Pillars (Blocking Vision) -->
  <rect x="480" y="140" width="90" height="170" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Wall Drop Shadows -->
  <rect x="570" y="150" width="40" height="160" fill="#000" opacity="0.45"/>

  <!-- Floor Decals (Blood / Impact Marks created via Batched Instances) -->
  <g id="decals">
    <!-- Blood splatter 1 -->
    <path d="M 320 280 Q 300 250 280 270 Q 250 290 280 320 Q 310 340 340 310 Q 350 280 320 280 Z" fill="#991b1b" opacity="0.8"/>
    <circle cx="260" cy="270" r="8" fill="#7f1d1d" opacity="0.7"/>
    <circle cx="250" cy="310" r="12" fill="#7f1d1d" opacity="0.75"/>
    <circle cx="350" cy="335" r="7" fill="#7f1d1d" opacity="0.65"/>
    
    <!-- Impact decal 2 -->
    <path d="M 410 190 Q 395 170 380 185 Q 360 200 385 220 Q 405 235 425 210 Z" fill="#b91c1c" opacity="0.85"/>
    <!-- Claw mark decal -->
    <path d="M 380 200 L 430 250 M 390 195 L 440 245 M 370 205 L 420 255" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Enemy 1 (Top Left) Casting Raycast Vision Cone -->
  <g id="enemy1" transform="translate(240, 120)">
    <!-- Dynamic Vision Cone (blocked by wall) -->
    <path d="M 0 0 L 160 80 L 190 140 L 130 190 L 0 0 Z" fill="url(#visionCone)"/>
    
    <!-- Vision Raycast indicators -->
    <line x1="0" y1="0" x2="160" y2="80" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
    <line x1="0" y1="0" x2="190" y2="140" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
    <line x1="0" y1="0" x2="130" y2="190" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

    <!-- Enemy Body (Robot/Cyborg top-down) -->
    <circle cx="0" cy="0" r="22" fill="#334155" stroke="#ef4444" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#1e293b"/>
    <!-- Red glowing sensor -->
    <circle cx="8" cy="8" r="6" fill="#ef4444" filter="url(#bloom)"/>
  </g>

  <!-- Player Character (Center-Left) with Aura/Shield -->
  <g id="player" transform="translate(360, 260)">
    <!-- Punch Attack Shockwave / Trail (RT: パンチ) -->
    <path d="M 20 -20 Q 60 0 50 40 Q 20 50 10 30" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#bloom)"/>
    <path d="M 30 -30 Q 80 0 65 55" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Player Aura / HP Visual Feedback -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
    <!-- Shadow -->
    <ellipse cx="2" cy="18" rx="20" ry="10" fill="#000" opacity="0.5"/>
    
    <!-- Orange Fighter Figure (Top-down view matching PDF screenshot) -->
    <ellipse cx="0" cy="0" rx="18" ry="16" fill="#ea580c" stroke="#fb923c" stroke-width="2"/>
    <!-- Head -->
    <circle cx="2" cy="-4" r="9" fill="#fed7aa"/>
    <!-- Shoulders / Arms -->
    <circle cx="-16" cy="2" r="7" fill="#ea580c"/>
    <circle cx="20" cy="8" r="9" fill="#f97316" stroke="#fdba74" stroke-width="1.5"/> <!-- punching fist -->
  </g>

  <!-- Target Enemy Struck by Punch -->
  <g id="enemy-hit" transform="translate(430, 275)">
    <!-- Radial Hit sparks -->
    <line x1="0" y1="0" x2="35" y2="-20" stroke="#fef08a" stroke-width="3" filter="url(#bloom)"/>
    <line x1="0" y1="0" x2="40" y2="15" stroke="#fef08a" stroke-width="3" filter="url(#bloom)"/>
    <line x1="0" y1="0" x2="20" y2="35" stroke="#fef08a" stroke-width="2"/>
    <line x1="0" y1="0" x2="-10" y2="40" stroke="#fef08a" stroke-width="2"/>
    
    <!-- Impact Glitch & Radial Blur visual motif -->
    <circle cx="10" cy="10" r="28" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.75"/>
    <circle cx="5" cy="5" r="16" fill="#475569" stroke="#dc2626" stroke-width="2"/>
  </g>

  <!-- Ambient Cinematic Overlay & UI Minimalist Action Prompt -->
  <!-- Action prompt badge "RT: パンチ" (as in slide 5) -->
  <g transform="translate(48, 380)">
    <rect width="170" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="27" fill="#f8fafc" font-size="18" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">
      <tspan fill="#38bdf8">RT : </tspan>PUNCH
    </text>
  </g>

  <!-- Title Watermark / HUD Badge -->
  <g transform="translate(610, 385)">
    <rect width="150" height="34" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="75" y="22" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">DIRECTX 12 / C++</text>
  </g>
</svg>
