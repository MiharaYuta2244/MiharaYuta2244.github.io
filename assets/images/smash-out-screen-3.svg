<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="blurGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="#0b0f19"/>
  <!-- Post-effect Radial Blur Lines radiating from center impact -->
  <g stroke="#f97316" stroke-width="1.5" opacity="0.4">
    <line x1="300" y1="180" x2="50" y2="40"/><line x1="300" y1="180" x2="550" y2="40"/>
    <line x1="300" y1="180" x2="40" y2="320"/><line x1="300" y1="180" x2="560" y2="320"/>
    <line x1="300" y1="180" x2="10" y2="180"/><line x1="300" y1="180" x2="590" y2="180"/>
    <line x1="300" y1="180" x2="300" y2="10"/><line x1="300" y1="180" x2="300" y2="350"/>
  </g>
  <!-- Center Explosion / Hit Flash -->
  <circle cx="300" cy="180" r="120" fill="url(#blurGlow)"/>
  <!-- Glitch offset lines -->
  <rect x="240" y="160" width="140" height="8" fill="#00f0ff" opacity="0.6"/>
  <rect x="220" y="195" width="160" height="6" fill="#ef4444" opacity="0.6"/>
  <!-- Impact Particles -->
  <circle cx="280" cy="150" r="5" fill="#fff"/>
  <circle cx="330" cy="160" r="4" fill="#fef08a"/>
  <circle cx="310" cy="220" r="6" fill="#fff"/>
  <text x="30" y="336" fill="#f59e0b" font-size="11" font-family="'Outfit', sans-serif">15+ Custom Post-Processing Shaders (Glitch &amp; Radial Blur)</text>
</svg>
