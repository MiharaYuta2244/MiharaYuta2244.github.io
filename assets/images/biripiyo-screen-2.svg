<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Play Screen matching slide 11 middle -->
  <rect width="600" height="360" fill="#171220"/>
  <!-- Top HUD (3 yellow chicks icon) -->
  <g transform="translate(40, 25)">
    <circle cx="15" cy="15" r="10" fill="#facc15" stroke="#ca8a04"/>
    <circle cx="45" cy="15" r="10" fill="#facc15" stroke="#ca8a04"/>
    <circle cx="75" cy="15" r="10" fill="#facc15" stroke="#ca8a04"/>
  </g>
  <!-- Background Gothic Castle Windows -->
  <g opacity="0.4">
    <path d="M 120 140 Q 150 90 180 140 L 180 270 L 120 270 Z" fill="#3b82f6"/>
    <path d="M 420 140 Q 450 90 480 140 L 480 270 L 420 270 Z" fill="#3b82f6"/>
  </g>
  <!-- Electric trap line across ceiling -->
  <path d="M 80 80 L 180 85 L 280 75 L 380 90 L 520 80" stroke="#facc15" stroke-width="3" fill="none"/>
  <!-- Player Chick jumping -->
  <g transform="translate(280, 160)">
    <rect width="36" height="30" rx="8" fill="#facc15" stroke="#eab308" stroke-width="2"/>
    <circle cx="12" cy="10" r="3" fill="#000"/>
    <circle cx="24" cy="10" r="3" fill="#000"/>
    <polygon points="15,18 21,18 18,24" fill="#f97316"/>
  </g>
  <!-- Control Prompt in bottom right (A: トッシン) -->
  <g transform="translate(490, 290)">
    <rect width="80" height="24" rx="4" fill="#000" fill-opacity="0.7"/>
    <text x="40" y="17" fill="#fff" font-size="11" font-family="'Outfit', sans-serif" text-anchor="middle">A : トッシン</text>
  </g>
  <rect x="20" y="325" width="180" height="22" rx="4" fill="#0f172a" fill-opacity="0.8"/>
  <text x="110" y="340" fill="#fff" font-size="11" font-family="sans-serif" text-anchor="middle">プレイ画面 (Play Screen)</text>
</svg>
