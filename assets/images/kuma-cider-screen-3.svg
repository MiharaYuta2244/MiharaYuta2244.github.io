<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Result Screen (Matching Slide 10 right) -->
  <rect width="600" height="360" fill="#0a0f1d"/>
  <!-- Confetti / Star Particles -->
  <g fill="#facc15" opacity="0.7">
    <circle cx="100" cy="80" r="4"/><circle cx="140" cy="140" r="3"/><circle cx="220" cy="60" r="5"/>
    <circle cx="480" cy="70" r="4"/><circle cx="520" cy="130" r="6"/><circle cx="420" cy="180" r="3"/>
  </g>
  <g fill="#f43f5e" opacity="0.6">
    <circle cx="180" cy="110" r="4"/><circle cx="80" cy="190" r="5"/><circle cx="530" cy="90" r="4"/>
  </g>
  <!-- Result Text & Score 41735 -->
  <g transform="translate(60, 60)">
    <text x="0" y="24" fill="#cbd5e1" font-size="18" font-family="'Outfit', sans-serif" font-weight="bold">あつめたおかしは</text>
    <text x="180" y="32" fill="#ffffff" font-size="48" font-family="'Outfit', sans-serif" font-weight="900" letter-spacing="2">41735</text>
    <text x="0" y="65" fill="#fbcfe8" font-size="22" font-family="'Outfit', sans-serif" font-weight="bold">じょうずだよ！</text>
  </g>
  <!-- Huge "Aランク!!" Badge -->
  <g transform="translate(60, 160)">
    <text x="10" y="90" fill="#ef4444" font-size="110" font-family="'Outfit', sans-serif" font-weight="900" stroke="#fff" stroke-width="4">A</text>
    <text x="105" y="75" fill="#ef4444" font-size="36" font-family="'Outfit', sans-serif" font-weight="900" stroke="#fff" stroke-width="2">ランク!!</text>
  </g>
  <!-- Bear Celebrating Victory -->
  <g transform="translate(420, 120)">
    <ellipse cx="60" cy="110" rx="44" ry="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="60" cy="45" r="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="28" cy="18" r="14" fill="#ffffff"/><circle cx="92" cy="18" r="14" fill="#ffffff"/>
    <ellipse cx="44" cy="42" rx="4" ry="5" fill="#1e293b"/>
    <ellipse cx="76" cy="42" rx="4" ry="5" fill="#1e293b"/>
    <!-- Cheerful V sign / Posing Arms -->
    <path d="M 15 90 L -10 60" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <path d="M 105 90 L 130 60" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  </g>
  <rect x="20" y="325" width="180" height="22" rx="4" fill="#0f172a" fill-opacity="0.8"/>
  <text x="110" y="340" fill="#fff" font-size="11" font-family="sans-serif" text-anchor="middle">リザルト画面 (Result Screen)</text>
</svg>
