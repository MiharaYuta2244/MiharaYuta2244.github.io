<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- CRT TV Curved Monitor Casing -->
  <rect width="600" height="360" rx="30" fill="#18181b" stroke="#27272a" stroke-width="8"/>
  <rect x="30" y="25" width="540" height="310" rx="20" fill="#09090b"/>
  <!-- Checkerboard Tatami -->
  <g fill="#27272a" opacity="0.4">
    <rect x="120" y="60" width="60" height="60"/><rect x="240" y="60" width="60" height="60"/><rect x="360" y="60" width="60" height="60"/>
    <rect x="180" y="120" width="60" height="60"/><rect x="300" y="120" width="60" height="60"/><rect x="420" y="120" width="60" height="60"/>
    <rect x="120" y="180" width="60" height="60"/><rect x="240" y="180" width="60" height="60"/><rect x="360" y="180" width="60" height="60"/>
  </g>
  <!-- Kanji "対傘" in center circle -->
  <circle cx="300" cy="170" r="70" fill="#000" fill-opacity="0.75"/>
  <text x="300" y="195" fill="#f4f4f5" font-size="54" font-family="'serif', 'Noto Serif JP', 'Yu Mincho'" font-weight="900" text-anchor="middle">対傘</text>
  <!-- Prompt "左クリック" -->
  <text x="300" y="275" fill="#cbd5e1" font-size="18" font-family="'Outfit', sans-serif" font-weight="bold" text-anchor="middle">左クリック</text>
  <rect x="40" y="305" width="180" height="22" rx="4" fill="#000" fill-opacity="0.8"/>
  <text x="130" y="320" fill="#fff" font-size="11" font-family="sans-serif" text-anchor="middle">タイトル画面 (CRT TV Effect)</text>
</svg>
