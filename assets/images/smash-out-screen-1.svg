<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#0d111a"/>
  <!-- Floor Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="60" x2="600" y2="60"/><line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/><line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/><line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/><line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>
  <!-- Wall -->
  <rect x="0" y="0" width="120" height="150" fill="#1e293b" stroke="#334155"/>
  <rect x="480" y="210" width="120" height="150" fill="#1e293b" stroke="#334155"/>
  <rect x="360" y="100" width="60" height="120" fill="#1e293b" stroke="#334155"/>
  <!-- Enemy Vision Cone -->
  <path d="M 180 80 L 360 100 L 360 220 L 260 260 Z" fill="#ef4444" fill-opacity="0.4"/>
  <circle cx="180" cy="80" r="16" fill="#334155" stroke="#ef4444" stroke-width="2"/>
  <circle cx="180" cy="80" r="5" fill="#ef4444"/>
  <!-- Player -->
  <circle cx="280" cy="220" r="18" fill="#ea580c" stroke="#fb923c" stroke-width="2"/>
  <circle cx="280" cy="216" r="9" fill="#fed7aa"/>
  <!-- Blood Decals -->
  <path d="M 230 240 Q 210 220 200 240 Q 180 260 210 270 Z" fill="#991b1b" opacity="0.8"/>
  <circle cx="190" cy="235" r="7" fill="#7f1d1d" opacity="0.7"/>
  <!-- Caption watermark -->
  <rect x="20" y="320" width="260" height="24" rx="4" fill="#000" fill-opacity="0.7"/>
  <text x="30" y="336" fill="#38bdf8" font-size="11" font-family="'Outfit', sans-serif">SMASH OUT : In-Game Action</text>
</svg>
