<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- CRT TV Curved Monitor Casing -->
  <rect width="600" height="360" rx="30" fill="#18181b" stroke="#27272a" stroke-width="8"/>
  <rect x="30" y="25" width="540" height="310" rx="20" fill="#451a03"/>
  <!-- Arena Stage (Wood / Tatami) -->
  <ellipse cx="300" cy="220" rx="220" ry="100" fill="#78350f" stroke="#b45309" stroke-width="2"/>
  <!-- Control Guide overlay top-left (Matching slide 12) -->
  <g transform="translate(50, 45)">
    <rect width="120" height="60" rx="4" fill="#000" fill-opacity="0.6"/>
    <text x="10" y="18" fill="#fbbf24" font-size="11" font-family="'JetBrains Mono', monospace">WASD : 移動</text>
    <text x="10" y="34" fill="#fbbf24" font-size="11" font-family="'JetBrains Mono', monospace">左クリック : 発射</text>
    <text x="10" y="50" fill="#fbbf24" font-size="11" font-family="'JetBrains Mono', monospace">マウス : エイム</text>
  </g>
  <!-- Aim Crosshair & Umbrella Projectile in Flight -->
  <g transform="translate(300, 140)">
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#ef4444" stroke-width="2"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#ef4444" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Spinning umbrella projectile -->
    <path d="M 0 -20 Q 20 0 0 20 Q -20 0 0 -20 Z" fill="#dc2626" opacity="0.8"/>
  </g>
  <!-- Player Samurai Character at Bottom -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-2" r="8" fill="#fed7aa"/>
  </g>
  <!-- Enemies -->
  <circle cx="200" cy="180" r="14" fill="#52525b" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="400" cy="180" r="14" fill="#52525b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="305" width="180" height="22" rx="4" fill="#000" fill-opacity="0.8"/>
  <text x="130" y="320" fill="#fff" font-size="11" font-family="sans-serif" text-anchor="middle">プレイ画面 (In-Game Combat)</text>
</svg>
