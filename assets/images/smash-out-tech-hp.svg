<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="95%" stop-color="#991b1b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="700" height="360" rx="12" fill="#0b0f17" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="350" y="38" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    状況を伝える描画制御 : HP連動エフェクト &amp; シェーダー
  </text>
  <text x="350" y="58" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">
    「UIゲージに頼らない」直感的な戦況伝達。HP減少に伴い血痕サイズ・生成頻度・画面減光が激化
  </text>

  <!-- Left: High HP State -->
  <g transform="translate(40, 85)">
    <rect width="290" height="240" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="290" height="32" rx="8" fill="#065f46" fill-opacity="0.4"/>
    <text x="145" y="21" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">HP: HIGH (健全・安定時)</text>

    <!-- Normal Character -->
    <circle cx="145" cy="110" r="22" fill="#ea580c" stroke="#fb923c" stroke-width="2"/>
    <circle cx="145" cy="106" r="10" fill="#fed7aa"/>

    <!-- Small minimal footprints/decals -->
    <ellipse cx="145" cy="155" rx="10" ry="4" fill="#334155" opacity="0.4"/>
    <ellipse cx="160" cy="175" rx="8" ry="3" fill="#334155" opacity="0.3"/>

    <!-- Status bullets -->
    <g transform="translate(20, 185)">
      <text x="0" y="14" fill="#a7f3d0" font-size="11">✓ 血痕デカール発生なし (または極小)</text>
      <text x="0" y="32" fill="#a7f3d0" font-size="11">✓ 画面クリア（クリアな視野）</text>
    </g>
  </g>

  <!-- Right: Low HP State (Critical) -->
  <g transform="translate(370, 85)">
    <rect width="290" height="240" rx="8" fill="#180a0a" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Vignette overlay in box -->
    <rect width="290" height="240" rx="8" fill="url(#vignette)"/>
    <rect width="290" height="32" rx="8" fill="#991b1b" fill-opacity="0.5"/>
    <text x="145" y="21" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">HP: CRITICAL (瀕死・危険時)</text>

    <!-- Character with heavy blood drops -->
    <circle cx="145" cy="105" r="22" fill="#ea580c" stroke="#ef4444" stroke-width="3"/>
    <circle cx="145" cy="101" r="10" fill="#fca5a5"/>

    <!-- Dynamic Heavy Blood Decals -->
    <path d="M 120 135 Q 110 120 95 130 Q 75 145 95 165 Q 115 175 135 155 Z" fill="#991b1b"/>
    <path d="M 160 145 Q 175 130 190 145 Q 200 165 180 180 Q 155 175 160 145 Z" fill="#b91c1c"/>
    <circle cx="85" cy="135" r="5" fill="#7f1d1d"/>
    <circle cx="195" cy="175" r="7" fill="#7f1d1d"/>
    <circle cx="145" cy="165" r="9" fill="#991b1b"/>

    <!-- Status bullets -->
    <g transform="translate(20, 185)">
      <text x="0" y="14" fill="#fca5a5" font-size="11">⚠️ 移動軌跡に巨大な血痕デカールが連続発生</text>
      <text x="0" y="32" fill="#fca5a5" font-size="11">⚠️ 周辺減光（Vignette）と心拍パルス同期</text>
    </g>
  </g>
</svg>
