<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Title Screen matching slide 11 left -->
  <rect width="600" height="360" fill="#1e1828"/>
  <!-- Stone castle brick gate -->
  <g fill="#332a42" stroke="#120e18" stroke-width="2">
    <rect x="100" y="80" width="400" height="280"/>
    <rect x="140" y="120" width="320" height="240" fill="#0d0a14"/>
  </g>
  <!-- Red subtitle banner -->
  <text x="300" y="110" fill="#ef4444" font-size="18" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">ゲキトツ!!</text>
  <!-- Title text (ビリピヨランブル !?) -->
  <text x="300" y="160" fill="#38bdf8" font-size="34" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" filter="drop-shadow(2px 2px 0px #0284c7)">
    ビリピヨランブル !?
  </text>
  <!-- Yellow pixel chick in front -->
  <rect x="180" y="195" width="28" height="24" rx="6" fill="#facc15"/>
  <circle cx="188" cy="202" r="2" fill="#000"/>
  <!-- Buttons -->
  <g transform="translate(230, 220)">
    <rect width="140" height="32" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="22" fill="#fff" font-size="16" font-family="'Outfit', sans-serif" font-weight="bold" text-anchor="middle">はじめる</text>
  </g>
  <g transform="translate(230, 265)">
    <rect width="140" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="70" y="22" fill="#94a3b8" font-size="16" font-family="'Outfit', sans-serif" font-weight="bold" text-anchor="middle">やめる</text>
  </g>
  <rect x="20" y="325" width="180" height="22" rx="4" fill="#0f172a" fill-opacity="0.8"/>
  <text x="110" y="340" fill="#fff" font-size="11" font-family="sans-serif" text-anchor="middle">タイトル画面 (Title Screen)</text>
</svg>
