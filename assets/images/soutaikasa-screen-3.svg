<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- CRT TV Curved Monitor Casing -->
  <rect width="600" height="360" rx="30" fill="#18181b" stroke="#27272a" stroke-width="8"/>
  <rect x="30" y="25" width="540" height="310" rx="20" fill="#1c1917"/>
  <!-- Cherry Blossom Tree & Leaves -->
  <path d="M 60 260 Q 80 180 140 160 Q 160 120 180 80" stroke="#78350f" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Pink Sakura petals -->
  <g fill="#f472b6" opacity="0.8">
    <ellipse cx="140" cy="120" rx="8" ry="4"/><ellipse cx="170" cy="100" rx="7" ry="5"/>
    <ellipse cx="210" cy="110" rx="8" ry="4"/><ellipse cx="250" cy="130" rx="6" ry="3"/>
    <ellipse cx="190" cy="150" rx="7" ry="4"/><ellipse cx="120" cy="150" rx="6" ry="4"/>
  </g>
  <!-- Boss Figure (Robot/Karakuri with Umbrella on back) -->
  <g transform="translate(360, 160)">
    <!-- Big Japanese Umbrella Behind -->
    <path d="M -60 -40 Q 0 -100 60 -40 Z" fill="#b91c1c" stroke="#fca5a5" stroke-width="2"/>
    <!-- Karakuri Torso -->
    <rect x="-24" y="-30" width="48" height="60" rx="6" fill="#ca8a04" stroke="#fef08a" stroke-width="2"/>
    <!-- Head with Mask -->
    <circle cx="0" cy="-45" r="16" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <circle cx="-5" cy="-48" r="3" fill="#000"/><circle cx="5" cy="-48" r="3" fill="#000"/>
    <path d="M -8 -38 Q 0 -34 8 -38" stroke="#dc2626" stroke-width="2" fill="none"/>
    <!-- Dramatic Arms Posed -->
    <path d="M -24 -10 L -60 -40" stroke="#ca8a04" stroke-width="10" stroke-linecap="round"/>
    <path d="M 24 -10 L 60 20" stroke="#ca8a04" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Movie Cutscene Subtitle (Matching slide 12) -->
  <g transform="translate(300, 275)">
    <rect x="-140" y="-18" width="280" height="34" rx="4" fill="#000" fill-opacity="0.85" stroke="#facc15" stroke-width="1"/>
    <text x="0" y="5" fill="#fef08a" font-family="'serif', 'Noto Serif JP', 'Yu Mincho'" font-size="16" font-weight="900" text-anchor="middle">
      唐笠門左衛門なりぃ!!
    </text>
  </g>
  <rect x="40" y="305" width="180" height="22" rx="4" fill="#000" fill-opacity="0.8"/>
  <text x="130" y="320" fill="#fff" font-size="11" font-family="sans-serif" text-anchor="middle">ムービーシーン (Boss Cutscene)</text>
</svg>
