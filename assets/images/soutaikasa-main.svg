<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <!-- CRT TV Screen effect & Japanese style dark wash -->
    <linearGradient id="kasaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#27272a"/>
      <rect x="20" width="20" height="20" fill="#18181b"/>
      <rect y="20" width="20" height="20" fill="#18181b"/>
      <rect x="20" y="20" width="20" height="20" fill="#27272a"/>
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#kasaBg)"/>

  <!-- Checkerboard Floor / Tatami -->
  <rect x="50" y="30" width="500" height="300" rx="16" fill="url(#checker)" stroke="#3f3f46" stroke-width="3"/>

  <!-- Scanlines Effect -->
  <g stroke="#000" stroke-width="1.5" opacity="0.25">
    <line x1="50" y1="50" x2="550" y2="50"/><line x1="50" y1="70" x2="550" y2="70"/>
    <line x1="50" y1="90" x2="550" y2="90"/><line x1="50" y1="110" x2="550" y2="110"/>
    <line x1="50" y1="130" x2="550" y2="130"/><line x1="50" y1="150" x2="550" y2="150"/>
    <line x1="50" y1="170" x2="550" y2="170"/><line x1="50" y1="190" x2="550" y2="190"/>
    <line x1="50" y1="210" x2="550" y2="210"/><line x1="50" y1="230" x2="550" y2="230"/>
    <line x1="50" y1="250" x2="550" y2="250"/><line x1="50" y1="270" x2="550" y2="270"/>
    <line x1="50" y1="290" x2="550" y2="290"/><line x1="50" y1="310" x2="550" y2="310"/>
  </g>

  <!-- Big Calligraphy Kanji "相対傘" -->
  <g transform="translate(180, 160)">
    <circle cx="120" cy="0" r="85" fill="#000" fill-opacity="0.6"/>
    <text x="120" y="24" fill="#fafafa" font-family="'serif', 'Noto Serif JP', 'Yu Mincho'" font-size="64" font-weight="900" letter-spacing="10" text-anchor="middle">
      相対傘
    </text>
  </g>

  <!-- Stylized Japanese Umbrella (Kasa) graphic -->
  <g transform="translate(420, 90)">
    <path d="M 0 60 Q 60 10 120 60 L 60 60 Z" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
    <line x1="60" y1="20" x2="60" y2="90" stroke="#fef08a" stroke-width="3"/>
  </g>

  <!-- Role Badge -->
  <g transform="translate(60, 275)">
    <rect width="200" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5"/>
    <text x="100" y="22" fill="#fca5a5" font-size="12" font-family="'Outfit', sans-serif" font-weight="bold" text-anchor="middle">担当: プレイヤープログラマー</text>
  </g>
</svg>
